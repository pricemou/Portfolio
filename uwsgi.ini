[uwsgi]
# Configuration uWSGI pour le déploiement en production

# Application Flask
# Option 1: Utiliser app.py directement
module = app:app
callable = app

# Option 2: Utiliser wsgi.py (recommandé)
# module = wsgi:application
# callable = application

# Socket et processus
socket = /tmp/portfolio.sock
chmod-socket = 666
vacuum = true
die-on-term = true

# Processus et threads
processes = 4
threads = 2
enable-threads = true
master = true

# Logging
logto = /var/log/uwsgi/portfolio.log
log-maxsize = 50000000
log-backupcount = 5

# Performance
max-requests = 5000
harakiri = 60
harakiri-verbose = true
reload-mercy = 10

# Memory
limit-as = 512
memory-report = true

# Stats
stats = /tmp/portfolio-stats.sock
stats-http = true

# Python
pythonpath = /path/to/your/project
virtualenv = /path/to/your/venv

# Environnement
env = FLASK_ENV=production
env = DEBUG=False

# Chroot (optionnel, pour plus de sécurité)
# chroot = /path/to/chroot

# UID/GID (optionnel, pour plus de sécurité)
# uid = www-data
# gid = www-data

