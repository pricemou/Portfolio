{% macro about_card(title, icon, description, projects=None) %}
<article class="about-card">
    <div class="about-card-head">
        <h3>{{ title }}</h3>
        {% if icon %}
        <span class="about-card-icon" aria-hidden="true">
            <img src="{{ url_for('static', filename=icon) }}" width="22" height="22" alt="" />
        </span>
        {% endif %}
    </div>
    <p>{{ description }}</p>
    {% if projects is not none and projects != '' %}
    <span class="about-card-tag">{{ projects }}</span>
    {% endif %}
</article>
{% endmacro %}
