<section id="services" class="dark-bg">
    <div class="services-grid">
        {% if services and services|length > 0 %}
            {% for service in services %}
            <div class="service-card light-bg">
                {% if service.icon %}
                <img src="{{ url_for('static', filename=service.icon) }}" width="48" height="48" alt="{{ service.title }}" class="service-icon" />
                {% else %}
                <img src="{{ url_for('static', filename='icons/code.svg') }}" width="48" height="48" alt="{{ service.title }}" class="service-icon" />
                {% endif %}
                <h3 class="white">{{ service.title }}</h3>
                <p class="gray">{{ service.description }}</p>
            </div>
            {% endfor %}
        {% else %}
            <div class="service-card light-bg" style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                <p class="gray">Aucun service disponible pour le moment.</p>
            </div>
        {% endif %}
    </div>
</section>
