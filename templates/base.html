<!DOCTYPE html>
<html lang="{{ lang|default('fr') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Claude Pricemou">
    <meta name="keywords" content="Claude Pricemou, Développeur Full Stack, Science des données, Flask, React, Python, Trois-Rivières, Québec">
    <meta name="description" content="{% block meta_description %}Claude Pricemou — Développeur Full Stack & Science des données à Trois-Rivières. Applications web, automatisation et analyse de données.{% endblock %}">
    <meta name="theme-color" content="#2D2E32">
    <link rel="canonical" href="{% block canonical %}https://claude225.pythonanywhere.com/{% endblock %}">
    <link rel="alternate" hreflang="fr" href="{{ request.base_url }}">
    <link rel="alternate" hreflang="en" href="{{ request.base_url }}">
    
    <meta property="og:site_name" content="Claude Pricemou">
    <meta property="og:locale" content="{{ 'en_CA' if lang == 'en' else 'fr_CA' }}">
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="{% block og_title %}Claude Pricemou — Développeur Full Stack & Science des données{% endblock %}"/>
    <meta property="og:description" content="{% block og_description %}Développeur Full Stack freelance à Trois-Rivières. Flask, React, data science.{% endblock %}"/>
    <meta property="og:url" content="{% block og_url %}https://claude225.pythonanywhere.com/{% endblock %}"/>
    <meta property="og:image" content="{{ url_for('static', filename='images/claude-pricemou.svg', _external=True) }}"/>
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Claude Pricemou — Full Stack & Data Science">
    
    <title>{% block title %}Claude Pricemou — Développeur Full Stack & Science des données{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/globals.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
    <script>
        function trackProjectView(projectId) {
            fetch('/api/analytics/track-project-view', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ project_id: projectId })
            }).catch(function () {});
        }

        (function trackPageView() {
            try {
                var path = window.location.pathname || '/';
                if (path.indexOf('/admin') === 0) return;
                fetch('/api/analytics/track-page', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_path: path }),
                    keepalive: true
                }).catch(function () {});
            } catch (e) {}
        })();
        
        function toggleMobileMenu() {
            const menu = document.querySelector('.nav-menu');
            const toggle = document.querySelector('.mobile-menu-toggle');
            const overlay = document.querySelector('.nav-menu-overlay');
            const body = document.body;
            if (menu && toggle) {
                const isActive = menu.classList.contains('active');
                if (isActive) {
                    menu.classList.remove('active');
                    toggle.classList.remove('active');
                    if (overlay) overlay.classList.remove('active');
                    body.style.overflow = '';
                } else {
                    menu.classList.add('active');
                    toggle.classList.add('active');
                    if (overlay) overlay.classList.add('active');
                    body.style.overflow = 'hidden';
                }
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.querySelector('.nav-menu-overlay');
            if (overlay) overlay.addEventListener('click', toggleMobileMenu);
            document.querySelectorAll('.nav-menu a').forEach(function(link) {
                link.addEventListener('click', function() {
                    setTimeout(function() {
                        const menu = document.querySelector('.nav-menu');
                        if (menu && menu.classList.contains('active')) toggleMobileMenu();
                    }, 200);
                });
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    const menu = document.querySelector('.nav-menu');
                    if (menu && menu.classList.contains('active')) toggleMobileMenu();
                }
            });
        });
        
        window.toggleMobileMenu = toggleMobileMenu;
        
        function openHeaderImageModal() {
            const modal = document.getElementById('headerImageModal');
            if (modal) {
                modal.style.display = 'flex';
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }
        
        function closeHeaderImageModal() {
            const modal = document.getElementById('headerImageModal');
            if (modal) {
                modal.style.display = 'none';
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }
        
        window.openHeaderImageModal = openHeaderImageModal;
        window.closeHeaderImageModal = closeHeaderImageModal;
        
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('headerImageModal');
            const overlay = modal ? modal.querySelector('.header-image-modal-overlay') : null;
            if (overlay) {
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) closeHeaderImageModal();
                });
            }
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal && modal.classList.contains('active')) {
                    closeHeaderImageModal();
                }
            });
        });
    </script>
</head>
<body>
    {% block content %}{% endblock %}
    
    <div id="headerImageModal" class="header-image-modal">
        <div class="header-image-modal-overlay"></div>
        <div class="header-image-modal-content">
            <button class="header-image-modal-close" onclick="closeHeaderImageModal()" aria-label="{{ t('close') }}">
                <span>&times;</span>
            </button>
            <img src="{{ url_for('static', filename='images/claude-pricemou.svg') }}" alt="Portrait de Claude Pricemou, développeur full stack" class="header-image-modal-img" />
        </div>
    </div>
</body>
</html>
