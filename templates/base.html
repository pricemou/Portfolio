<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Pricemou claude">
    <meta name="keywords" content="Développeur Full-Stack, Data Science, Python, React, Node.js, Machine Learning, Web Development, Data Analytics">
    <meta name="description" content="Développeur Full-Stack & Data Science passionné, spécialisé dans la création d'applications web complètes et l'analyse de données.">
    <meta name="theme-color" content="#2D2E32">
    
    <meta property="og:site_name" content="Pricemou - Développeur Full-Stack & Data Science">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="Pricemou - Développeur Full-Stack & Data Science"/>
    <meta property="og:image" content="{{ url_for('static', filename='images/blaiti.png') }}"/>
    
    <title>{% block title %}Pricemou - Développeur Full-Stack & Data Science{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/globals.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
    <script>
        // Fonction pour tracker les vues de projets
        function trackProjectView(projectId) {
            fetch('/api/analytics/track-project-view', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ project_id: projectId })
            }).catch(err => console.debug('Erreur tracking projet:', err));
        }
    </script>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
