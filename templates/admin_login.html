<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - Pricemou</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #25262A 0%, #2D2E32 100%);
            padding: var(--spacing-4);
        }
        
        .login-card {
            background: var(--light-bg);
            border-radius: var(--radius-lg);
            padding: var(--spacing-8);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-8);
        }
        
        .login-header h1 {
            color: var(--white);
            font-size: 2rem;
            margin-bottom: var(--spacing-2);
        }
        
        .login-header p {
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        .login-icon {
            width: 80px;
            height: 80px;
            background: var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--spacing-4);
            font-size: 2rem;
        }
        
        .alert {
            padding: var(--spacing-3) var(--spacing-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-4);
            border-left: 4px solid;
        }
        
        .alert-error {
            background: rgba(220, 53, 69, 0.1);
            border-color: #dc3545;
            color: #dc3545;
        }
        
        .alert-success {
            background: rgba(77, 186, 135, 0.1);
            border-color: var(--green);
            color: var(--green);
        }
        
        .login-form .form-group {
            margin-bottom: var(--spacing-6);
        }
        
        .login-form label {
            display: block;
            margin-bottom: var(--spacing-2);
            color: var(--white);
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .login-form input {
            width: 100%;
            padding: var(--spacing-3) var(--spacing-4);
            background: var(--dark-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: var(--white);
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .login-form input:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .login-form input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(77, 186, 135, 0.15);
            background: var(--light-bg);
        }
        
        .login-btn {
            width: 100%;
            padding: var(--spacing-4);
            background: var(--green);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Roboto Mono', monospace;
        }
        
        .login-btn:hover {
            background: #3da870;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(77, 186, 135, 0.3);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .back-link {
            text-align: center;
            margin-top: var(--spacing-6);
        }
        
        .back-link a {
            color: var(--gray);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        
        .back-link a:hover {
            color: var(--green);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">🔐</div>
                <h1>Connexion Admin</h1>
                <p>Accédez à l'interface d'administration</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST" action="{{ url_for('admin_login') }}" class="login-form">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required autofocus placeholder="admin">
                </div>
                
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="login-btn">Se connecter</button>
            </form>
            
            <div class="back-link">
                <a href="{{ url_for('index') }}">← Retour au site</a>
            </div>
        </div>
    </div>
</body>
</html>
